name: Build & Test

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Build frontend
        run: bun run build:vercel

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          echo "Vite build output verified."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-trend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  serverless-types:
    name: Serverless API Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check serverless API TypeScript
        run: |
          bunx tsc --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --skipLibCheck api/*.ts
